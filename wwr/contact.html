<!doctype html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Us | Rafting Adventures Peru</title>
    <meta name="description"
      content="Contact Rafting Adventures Peru to book your next rafting experience, ask questions, or learn more about our exciting adventure tours across Peru." />
    <meta name="author" content="Gisela Casas">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <a href="index.html" class="home-link">
            <img src="images/rap-logo.webp" alt="Rafting Adventures Peru Logo" class="logo">
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main class="contact-page">

        <section class="contact-info">
            <h1>Rafting Adventures Peru</h1>
            <address>
                Av. José Larco 1232<br>
                Lima 15074, Peru<br>
                <a href="tel:+512000003">(01) 200-0003</a><br>
                <a href="mailto:info@raftingadventures.pe">info@raftingadventures.pe</a><br>
            </address>
        </section>

        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d243.79563071529859!2d-77.0301611684921!3d-12.130610853923594!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9105b7e1d0e0d61d%3A0xd98b384f0ab60d5d!2sWeWork%20%2B%20Larco!5e0!3m2!1ses!2spe!4v1785625000427!5m2!1ses!2spe"
          width="600" height="450" allowfullscreen="" loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin"></iframe>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <figure class="employee">
                <img src="images/guide1.jpg"
                  alt="Portrait of a man with a pair of glasses, suit and white shirt">
                <figcaption>Carlos Mendoza<br>Operations Manager</figcaption>
            </figure>
            <figure class="employee">
                <img src="images/guide2.jpg" alt="Portrait of a woman with long hair">
                <figcaption>Ana Flores<br>Adventure Coordinator</figcaption>
            </figure>
            <figure class="employee">
                <img src="images/guide3.jpg" alt="Portrait of a man with a cap and a bagpack">
                <figcaption>Luis Ramos<br>Safety Instructor</figcaption>
            </figure>
        </section>

        <form action="#" class="contact-form">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required placeholder="Your full name">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="Your email address">

            <div class="purpose">
                <p>Message Purpose:</p>
                <fieldset>
                    <input id="inquiry" type="radio" name="purpose" value="inquiry" required>
                    <label for="inquiry">General Inquiry</label>

                    <input id="reservation" type="radio" name="purpose" value="reservation">
                    <label for="reservation">Reservation Question</label>

                    <input id="feedback" type="radio" name="purpose" value="feedback">
                    <label for="feedback">Website Suggestion</label>
                </fieldset>
            </div>
            <div class="full-w">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="4" required
                  placeholder="Your message"></textarea>
            </div>
            <div class="subscribe">
                <input type="checkbox" id="subscribe" name="subscribe" value="yes">
                <label for="subscribe">Please Subscribe me to monthly newsletter</label>
            </div>
            <button type="submit" class="btn btn-submit">Get in Touch!</button>
        </form>

    </main>

    <footer>
        <p>&copy; 2026 Rafting Adventures Peru | Gisela Casas</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>

</body>

</html>
